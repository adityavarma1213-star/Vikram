services:
  - type: web
    name: vikram-accumulation
    runtime: node
    buildCommand: npm install --prefix server
    startCommand: node server/src/migrate.js && node server/src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vikram-market-data
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false


databases:
  - name: vikram-market-data
    databaseName: vikram
    user: vikram
