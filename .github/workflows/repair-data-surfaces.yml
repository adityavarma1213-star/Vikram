name: Repair VIKRAM data surfaces

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified data surface repair
        run: |
          python tools/repair_data_surfaces.py || true
          python tools/fix_accumulation_test.py
      - name: Verify JavaScript and tests
        run: |
          node --check js/app.js
          node --check server/test/accumulationEngine.test.js
          (cd server && npm test)
      - name: Commit repaired data surfaces and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js server/test/accumulationEngine.test.js
          if git diff --cached --quiet; then
            echo "No repair changes needed."
            exit 0
          fi
          git commit -m "fix: restore full verified scanner surfaces and strict OBV fixture [skip ci]"
          git push
