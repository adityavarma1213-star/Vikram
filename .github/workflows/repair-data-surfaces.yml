name: Repair VIKRAM data surfaces

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified data surface repair
        run: python tools/repair_data_surfaces.py
      - name: Verify JavaScript
        run: node --check js/app.js
      - name: Commit repaired data surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          if git diff --cached --quiet; then
            echo "No data surface changes needed."
            exit 0
          fi
          git commit -m "fix(ui): render full verified scanner and discovery surfaces [skip ci]"
          git push
