name: UI Repair 2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair scanner UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path=Path('js/app.js')
          text=path.read_text(encoding='utf-8')
          start=text.index('  const setupColumnFilters = async () => {')
          end=text.index('\n  try { await window.VIKRAM_DATA_ENGINE.loadSnapshot(); } catch (_) {}',start)
          replacement=r'''  const setupColumnFilters = async () => {
    const surface=document.querySelector('.scanner-container-surface'); if(!surface)return;
    const filterControls=surface.querySelector('.filter-controls'); const segmentBar=surface.querySelector('.vikram-segment-filters'); if(!filterControls||!segmentBar)return;
    if(segmentBar.parentElement===filterControls)filterControls.parentNode.insertBefore(segmentBar,filterControls); filterControls.style.display='none';
    const headerConfig=[['Stock','stock','stock'],['Price','price','price'],['Change','priceChangePct','change'],['Score','score','score'],['Volume','volumeRatio','volume'],['Delivery','deliveryPct','delivery'],['OBV Trend','obvTrend','trend'],['Futures OI','changeOi','oi'],['Verdict','verdict','verdict']];
    const headers=[...surface.querySelectorAll('.scanner-table thead th')].slice(0,headerConfig.length),state={}; let snapshot=await getScannerSnapshot();
    const symbolOf=row=>normalizeSymbol(row.querySelector('td div')?.textContent||row.dataset.symbol||row.querySelector('td')?.textContent);
    const value=(item,key)=>key==='price'?Number(item?.metrics?.close):key==='priceChangePct'?Number(item?.metrics?.priceChangePct):key==='score'?Number(item?.score):key==='volumeRatio'?Number(item?.metrics?.volumeRatio):key==='deliveryPct'?Number(item?.metrics?.deliveryPct):key==='obvTrend'?Number(item?.metrics?.obvTrend):key==='changeOi'?Number(item?.metrics?.changeOi):key==='verdict'?String(item?.verdict||''):null;
    const opts=type=>type==='stock'?[['','All Stocks'],...[...new Set((snapshot?.results||[]).map(x=>normalizeSymbol(x.symbol||x.ticker||x.stock)).filter(Boolean))].sort().map(x=>[x,x])]:type==='price'?[['','All Prices'],['0-100','Below ₹100'],['100-500','₹100–₹500'],['500-1000','₹500–₹1,000'],['1000-5000','₹1,000–₹5,000'],['5000+','Above ₹5,000']]:type==='change'?[['','All Changes'],['positive','Positive'],['negative','Negative'],['0-1','0% to +1%'],['1+','Above +1%'],['-1-0','0% to -1%'],['-1+','Below -1%']]:type==='score'?[['','All Scores'],['75+','75–100'],['60-74','60–74'],['40-59','40–59'],['0-39','0–39']]:type==='volume'?[['','All Volume'],['1.2+','≥ 1.20x'],['1-1.19','1.00x–1.19x'],['0.8-0.99','0.80x–0.99x'],['0-0.79','Below 0.80x']]:type==='delivery'?[['','All Delivery'],['55+','≥ 55%'],['45-54','45%–54%'],['35-44','35%–44%'],['0-34','Below 35%']]:type==='trend'?[['','All Trends'],['Rising','Rising'],['Flat','Flat'],['Falling','Falling'],['N/A','N/A']]:type==='oi'?[['','All Futures OI'],['positive','Positive'],['negative','Negative'],['na','N/A']]:[['','All Verdicts'],['ACCUMULATION CONFIRMED','Accumulation Confirmed'],['ACCUMULATION STARTING','Accumulation Starting'],['QUIET ABSORPTION','Quiet Absorption'],['DISTRIBUTION','Distribution'],['UNCONFIRMED / MIXED','Unconfirmed / Mixed']];
    const match=(raw,type,s)=>{if(!s)return true;if(type==='stock')return String(raw||'').toUpperCase()===s.toUpperCase();if(type==='trend'){const n=Number(raw),t=!Number.isFinite(n)?'N/A':n>0?'Rising':n<0?'Falling':'Flat';return t===s;}if(type==='verdict')return String(raw||'').toUpperCase()===s.toUpperCase();if(type==='oi'){const n=Number(raw);return s==='na'?!Number.isFinite(n):s==='positive'?Number.isFinite(n)&&n>0:Number.isFinite(n)&&n<0;}const n=Number(raw);if(!Number.isFinite(n))return false;if(type==='price')return s==='5000+'?n>5000:s.endsWith('+')?n>=Number(s.slice(0,-1)):n>=Number(s.split('-')[0])&&n<=Number(s.split('-')[1]);if(type==='change')return s==='positive'?n>0:s==='negative'?n<0:s==='1+'?n>1:s==='-1+'?n<-1:n>=Number(s.split('-')[0])&&n<=Number(s.split('-')[1]);if(type==='score')return s==='75+'?n>=75:n>=Number(s.split('-')[0])&&n<=Number(s.split('-')[1]);if(type==='volume')return s==='1.2+'?n>=1.2:n>=Number(s.split('-')[0])&&n<=Number(s.split('-')[1]);if(type==='delivery')return s==='55+'?n>=55:n>=Number(s.split('-')[0])&&n<=Number(s.split('-')[1]);return true;};
    const apply=()=>{const map=new Map((snapshot?.results||[]).map(x=>[normalizeSymbol(x.symbol||x.ticker||x.stock),x]));surface.querySelectorAll('.scanner-table tbody tr').forEach(row=>{const sym=symbolOf(row),item=map.get(sym);let ok=true;for(const [key,s] of Object.entries(state)){const type=headerConfig.find(x=>x[1]===key)?.[2];if(!match(key==='stock'?sym:value(item,key),type,s)){ok=false;break;}}row.classList.toggle('vikram-column-hidden',!ok);});surface.querySelectorAll('.vikram-column-filter').forEach(b=>b.classList.toggle('active',Boolean(state[b.dataset.filterKey])));};
    const close=()=>document.querySelector('.vikram-simple-filter-menu')?.remove(); const open=(button,label,key,type)=>{close();const menu=document.createElement('div');menu.className='vikram-simple-filter-menu';menu.innerHTML=`<div class="simple-filter-title">${label}</div><select aria-label="Filter ${label}">${opts(type).map(([v,t])=>`<option value="${v}" ${state[key]===v?'selected':''}>${t}</option>`).join('')}</select>`;document.body.appendChild(menu);const r=button.getBoundingClientRect();menu.style.left=`${Math.max(8,Math.min(r.left,window.innerWidth-menu.offsetWidth-8))}px`;menu.style.top=`${Math.min(window.innerHeight-menu.offsetHeight-8,r.bottom+5)}px`;const s=menu.querySelector('select');s.addEventListener('change',()=>{if(s.value)state[key]=s.value;else delete state[key];close();apply();});s.focus();};
    headers.forEach((th,i)=>{const [label,key,type]=headerConfig[i];th.dataset.filterKey=key;th.querySelector('.vikram-column-filter')?.remove();const b=document.createElement('button');b.type='button';b.className='vikram-column-filter';b.dataset.filterKey=key;b.title=`Filter ${label}`;b.setAttribute('aria-label',`Filter ${label}`);b.textContent='⌄';th.appendChild(b);b.addEventListener('click',e=>{e.stopPropagation();open(b,label,key,type);});});
    let reset=surface.querySelector('.vikram-filter-reset');if(!reset){reset=document.createElement('button');reset.type='button';reset.className='vikram-filter-reset';reset.textContent='Reset Filters';segmentBar.appendChild(reset);}reset.onclick=()=>{Object.keys(state).forEach(k=>delete state[k]);close();apply();};document.addEventListener('click',e=>{if(!e.target.closest('.vikram-simple-filter-menu')&&!e.target.closest('.vikram-column-filter'))close();});window.addEventListener('scroll',close,true);window.addEventListener('resize',close);new MutationObserver(()=>setTimeout(apply,0)).observe(surface.querySelector('.scanner-table-wrap')||surface,{childList:true,subtree:true});setInterval(async()=>{const next=await getScannerSnapshot();if(next){snapshot=next;apply();}},60000);apply();
  };

  const setupDiscoveryTabsAndColors=async()=>{
    const surface=document.querySelector('.scanner-container-surface'),tabs=surface?.querySelector('.surface-tabs');if(!surface||!tabs)return;
    if(!document.getElementById('vikramDiscoveryStyles')){const style=document.createElement('style');style.id='vikramDiscoveryStyles';style.textContent='.vikram-simple-filter-menu{position:fixed;z-index:10000;min-width:210px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:10px;box-shadow:var(--shadow-lg);padding:9px}.simple-filter-title{font-size:10px;font-weight:900;color:var(--text-main);margin-bottom:6px}.vikram-simple-filter-menu select{width:100%;border:1px solid var(--border-subtle);background:var(--bg-card-2);color:var(--text-main);border-radius:7px;padding:8px;font-size:11px;font-weight:800}.scanner-table td.vikram-positive{color:var(--green);font-weight:900}.scanner-table td.vikram-negative{color:var(--red);font-weight:900}.scanner-table td.vikram-score-good{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green);font-weight:900}.scanner-table td.vikram-score-mid{background:color-mix(in srgb,#f59e0b 18%,transparent);color:#fbbf24;font-weight:900}.scanner-table td.vikram-score-low{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);font-weight:900}.scanner-table td.vikram-bullish{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green);font-weight:900}.scanner-table td.vikram-warning{background:color-mix(in srgb,#f59e0b 16%,transparent);color:#fbbf24;font-weight:900}.scanner-table td.vikram-bearish{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);font-weight:900}.scanner-table td.vikram-verdict{font-weight:900}.vikram-discovery-panel{margin-top:13px}.vikram-discovery-table{width:100%;min-width:980px;border-collapse:collapse}.vikram-discovery-table th,.vikram-discovery-table td{padding:10px;border-bottom:1px solid var(--border-subtle);font-size:10px;text-align:left}.vikram-discovery-table th{font-size:8px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;background:var(--bg-card-2)}.v-confirmed{color:var(--green);font-weight:900}.v-starting{color:var(--accent-cyan);font-weight:900}.v-quiet{color:#a855f7;font-weight:900}.v-distribution{color:var(--red);font-weight:900}.score-good{color:var(--green);font-weight:900}.score-mid{color:#fbbf24;font-weight:900}.score-low{color:var(--red);font-weight:900}';document.head.appendChild(style);}
    const scannerWrap=surface.querySelector('.scanner-table-wrap');let panel=surface.querySelector('.vikram-discovery-panel');if(!panel){panel=document.createElement('div');panel.className='vikram-discovery-panel vikram-tab-hidden';scannerWrap?.parentNode.insertBefore(panel,scannerWrap);}
    const add=(id,label)=>{if(tabs.querySelector(`[data-vikram-discovery="${id}"]`))return;const b=document.createElement('button');b.type='button';b.className='surface-tab';b.dataset.vikramDiscovery=id;b.textContent=label;tabs.appendChild(b);};add('radar','Opportunity Radar');add('gems','Hidden Gems');
    const num=v=>{const n=Number(v);return Number.isFinite(n)?n:null};const fmt=(v,s='')=>{const n=num(v);return n===null?'N/A':`${n.toFixed(1)}${s}`};const money=v=>{const n=num(v);return n===null?'N/A':`₹${n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}`};const vc=v=>{const s=String(v||'').toUpperCase();return s.includes('CONFIRMED')?'v-confirmed':s.includes('STARTING')?'v-starting':s.includes('QUIET')?'v-quiet':s.includes('DISTRIBUTION')?'v-distribution':''};const sc=s=>s>=75?'score-good':s>=55?'score-mid':'score-low';
    const render=async kind=>{const snap=await getScannerSnapshot();if(!snap){panel.innerHTML='<div class="dashboard-card"><p class="text-muted">DATA N/A — a verified EOD scanner snapshot is required.</p></div>';return;}const rows=Array.isArray(snap.results)?snap.results:[];let data;if(kind==='radar'){const rank=r=>{const s=num(r.score),v=String(r.verdict||'');return(s??-1)+(v==='ACCUMULATION CONFIRMED'?20:v==='ACCUMULATION STARTING'?10:0)};data=rows.filter(r=>num(r.score)!==null&&String(r.verdict||'')!=='DISTRIBUTION').sort((a,b)=>rank(b)-rank(a)||num(b.score)-num(a.score)).slice(0,100).map(row=>({row,m:row.metrics||{},score:num(row.score)}));}else{data=rows.map(row=>{const m=row.metrics||{},score=num(row.score),signals=[num(m.volumeRatio)!==null&&num(m.volumeRatio)>=1.2,num(m.deliveryPct)!==null&&num(m.deliveryPct)>=45,num(m.obvTrend)!==null&&num(m.obvTrend)>0,num(m.changeOi)!==null&&num(m.changeOi)>0,num(m.priceChangePct)!==null&&num(m.priceChangePct)>=0].filter(Boolean).length;return{row,m,score,signals}}).filter(x=>x.score!==null&&x.score>=55&&x.score<85&&x.row.verdict!=='DISTRIBUTION'&&x.signals>=2).sort((a,b)=>b.signals-a.signals||b.score-a.score).slice(0,25);}
      panel.innerHTML=`<div class="dashboard-card"><h2 class="card-headline">${kind==='radar'?'🛰 Opportunity Radar':'💎 Hidden Gems Alpha Discovery'}</h2><p class="text-muted">${snap.dataStatus||'EOD VERIFIED'} · As of ${snap.asOf||'N/A'} · ${data.length} verified results</p><div class="scanner-table-wrap"><table class="vikram-discovery-table"><thead><tr>${kind==='radar'?'<th>Rank</th><th>Symbol</th><th>Price</th><th>Score</th><th>Price %</th><th>Volume</th><th>Delivery</th><th>OI Change</th><th>Verdict</th><th>Why</th>':'<th>Rank</th><th>Symbol</th><th>Score</th><th>Price %</th><th>Volume</th><th>Delivery</th><th>OI Change</th><th>Signals</th><th>Verdict</th>'}</tr></thead><tbody>${data.map((x,i)=>{const r=x.row,m=x.m||{},s=x.score??num(r.score),why=Array.isArray(r.why)?r.why.slice(0,3).join(' '):'Verified scanner signals';return `<tr><td>${i+1}</td><td><strong>${r.symbol||r.ticker||'N/A'}</strong></td>${kind==='radar'?`<td>${money(m.close??m.last_price)}</td>`:''}<td class="${sc(s)}">${s===null?'N/A':s}</td><td>${fmt(m.priceChangePct,'%')}</td><td>${fmt(m.volumeRatio,'x')}</td><td>${fmt(m.deliveryPct,'%')}</td><td>${m.changeOi==null?'N/A':Number(m.changeOi).toLocaleString('en-IN')}</td>${kind==='gems'?`<td>${x.signals}/5</td>`:''}<td class="${vc(r.verdict)}">${r.verdict||'N/A'}</td>${kind==='radar'?`<td>${why}</td>`:''}</tr>`}).join('')}</tbody></table></div></div>`;};
    const colorize=()=>{surface.querySelectorAll('.scanner-table tbody tr').forEach(row=>{const c=row.querySelectorAll('td');if(c.length<9)return;c.forEach(x=>x.classList.remove('vikram-positive','vikram-negative','vikram-score-good','vikram-score-mid','vikram-score-low','vikram-bullish','vikram-warning','vikram-bearish','vikram-verdict'));const ch=num(c[2]?.textContent.replace('%',''));if(ch!==null)c[2].classList.add(ch>0?'vikram-positive':ch<0?'vikram-negative':'vikram-warning');const s=num(c[3]?.textContent);if(s!==null)c[3].classList.add(s>=75?'vikram-score-good':s>=55?'vikram-score-mid':'vikram-score-low');const v=num(c[4]?.textContent.replace('x',''));if(v!==null)c[4].classList.add(v>=1.1?'vikram-bullish':v>=.8?'vikram-warning':'vikram-bearish');const d=num(c[5]?.textContent.replace('%',''));if(d!==null)c[5].classList.add(d>=55?'vikram-bullish':d>=45?'vikram-warning':'vikram-bearish');const t=String(c[6]?.textContent||'');c[6].classList.add(t==='Rising'?'vikram-bullish':t==='Falling'?'vikram-bearish':'vikram-warning');const oi=String(c[7]?.textContent||'');const on=num(oi.replace(/,/g,''));c[7].classList.add(oi==='N/A'?'vikram-warning':on>0?'vikram-positive':on<0?'vikram-negative':'vikram-warning');const ve=String(c[8]?.textContent||'').toUpperCase();c[8].classList.add('vikram-verdict',ve.includes('CONFIRMED')?'vikram-bullish':ve.includes('STARTING')?'vikram-positive':ve.includes('QUIET')?'vikram-warning':ve.includes('DISTRIBUTION')?'vikram-bearish':'vikram-warning');});};
    const set=kind=>{tabs.querySelectorAll('.surface-tab').forEach(t=>t.classList.toggle('active',kind?t.dataset.vikramDiscovery===kind:!t.dataset.vikramDiscovery&&t.textContent.trim()==='Top Opportunities'));if(kind){scannerWrap?.classList.add('vikram-tab-hidden');panel.classList.remove('vikram-tab-hidden');render(kind);}else{scannerWrap?.classList.remove('vikram-tab-hidden');panel.classList.add('vikram-tab-hidden');}};
    tabs.querySelectorAll('[data-vikram-discovery]').forEach(t=>t.addEventListener('click',()=>set(t.dataset.vikramDiscovery)));colorize();new MutationObserver(colorize).observe(scannerWrap||surface,{childList:true,subtree:true});
  };
'''
          text=text[:start]+replacement+text[end:]
          text=text.replace('  await setupColumnFilters();\n','  await setupColumnFilters();\n  await setupDiscoveryTabsAndColors();\n')
          path.write_text(text,encoding='utf-8')
          for p in ['.github/workflows/ui-repair-simple-filters.yml','.github/workflows/ui-repair2.yml']: Path(p).unlink(missing_ok=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True);subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','js/app.js','.github/workflows/ui-repair-simple-filters.yml','.github/workflows/ui-repair2.yml'],check=True)
          subprocess.run(['git','commit','-m','fix(ui): simplify scanner filters restore discovery and add color coding'],check=True)
          subprocess.run(['git','push'],check=True)
          PY
