name: VIKRAM UI Pages Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'about.html'
      - 'accumulation.html'
      - 'accumulation/**'
      - 'alerts.html'
      - 'scanner.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'manifest.json'
      - 'sw.js'
      - '.github/workflows/ui-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
