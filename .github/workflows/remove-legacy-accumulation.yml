name: Repair VIKRAM scanner UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic scanner UI repair
        run: python tools/repair_scanner_ui.py

      - name: Verify JavaScript
        run: node --check js/app.js

      - name: Commit repaired UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/app.js
          if git diff --cached --quiet; then
            echo "No repair changes needed."
            exit 0
          fi
          git commit -m "fix(ui): simple scanner dropdowns, color coding, responsive table [skip ci]"
          git push
