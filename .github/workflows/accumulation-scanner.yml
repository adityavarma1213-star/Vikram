name: Accumulation Scanner Checks

on:
  push:
    branches: [main, feature/accumulation-scanner-phase0]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/scannerEngine.js
      - run: node --check src/ingest.js
      - run: node --check src/index.js
      - run: node --check src/migrate.js
      - run: node test/scanner.test.js
