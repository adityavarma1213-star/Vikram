name: UI Repair - Simple Filters and Discovery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply scanner UI repair
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          path = Path('js/app.js')
          text = path.read_text(encoding='utf-8')
          start = text.index('  const setupColumnFilters = async () => {')
          end = text.index('\n  try { await window.VIKRAM_DATA_ENGINE.loadSnapshot(); } catch (_) {}', start)

          replacement = r'''  const setupColumnFilters = async () => {
    const surface = document.querySelector('.scanner-container-surface');
    if (!surface) return;
    const filterControls = surface.querySelector('.filter-controls');
    const segmentBar = surface.querySelector('.vikram-segment-filters');
    if (!filterControls || !segmentBar) return;

    if (segmentBar.parentElement === filterControls) filterControls.parentNode.insertBefore(segmentBar, filterControls);
    filterControls.style.display = 'none';

    const headerConfig = [
      ['Stock','stock','stock'],['Price','price','price'],['Change','priceChangePct','change'],['Score','score','score'],['Volume','volumeRatio','volume'],['Delivery','deliveryPct','delivery'],['OBV Trend','obvTrend','trend'],['Futures OI','changeOi','oi'],['Verdict','verdict','verdict']
    ];
    const headers = [...surface.querySelectorAll('.scanner-table thead th')].slice(0, headerConfig.length);
    const state = {};
    let snapshot = await getScannerSnapshot();

    const getSymbol = row => normalizeSymbol(row.querySelector('td div')?.textContent || row.dataset.symbol || row.querySelector('td')?.textContent);
    const valueFor = (item, key) => {
      if (!item) return null;
      if (key === 'price') return Number(item.metrics?.close);
      if (key === 'priceChangePct') return Number(item.metrics?.priceChangePct);
      if (key === 'score') return Number(item.score);
      if (key === 'volumeRatio') return Number(item.metrics?.volumeRatio);
      if (key === 'deliveryPct') return Number(item.metrics?.deliveryPct);
      if (key === 'obvTrend') return Number(item.metrics?.obvTrend);
      if (key === 'changeOi') return Number(item.metrics?.changeOi);
      if (key === 'verdict') return String(item.verdict || '');
      return null;
    };

    const escapeHtml = value => String(value ?? '').replace(/[&<>\"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','\"':'&quot;'}[char]));
    const optionsFor = (type, key) => {
      if (type === 'stock') {
        const symbols = [...new Set((snapshot?.results || []).map(item => normalizeSymbol(item.symbol || item.ticker || item.stock)).filter(Boolean))].sort();
        return [['','All Stocks'], ...symbols.map(symbol => [symbol, symbol])];
      }
      if (type === 'price') return [['','All Prices'],['0-100','Below ₹100'],['100-500','₹100–₹500'],['500-1000','₹500–₹1,000'],['1000-5000','₹1,000–₹5,000'],['5000+','Above ₹5,000']];
      if (type === 'change') return [['','All Changes'],['positive','Positive'],['negative','Negative'],['0-1','0% to +1%'],['1+','Above +1%'],['-1-0','0% to -1%'],['-1+','Below -1%']];
      if (type === 'score') return [['','All Scores'],['75+','75–100'],['60-74','60–74'],['40-59','40–59'],['0-39','0–39']];
      if (type === 'volume') return [['','All Volume'],['1.2+','≥ 1.20x'],['1-1.19','1.00x–1.19x'],['0.8-0.99','0.80x–0.99x'],['0-0.79','Below 0.80x']];
      if (type === 'delivery') return [['','All Delivery'],['55+','≥ 55%'],['45-54','45%–54%'],['35-44','35%–44%'],['0-34','Below 35%']];
      if (type === 'trend') return [['','All Trends'],['Rising','Rising'],['Flat','Flat'],['Falling','Falling'],['N/A','N/A']];
      if (type === 'oi') return [['','All Futures OI'],['positive','Positive'],['negative','Negative'],['na','N/A']];
      if (type === 'verdict') return [['','All Verdicts'],['ACCUMULATION CONFIRMED','Accumulation Confirmed'],['ACCUMULATION STARTING','Accumulation Starting'],['QUIET ABSORPTION','Quiet Absorption'],['DISTRIBUTION','Distribution'],['UNCONFIRMED / MIXED','Unconfirmed / Mixed']];
      return [['','All']];
    };

    const matches = (raw, type, selected) => {
      if (!selected) return true;
      if (type === 'stock') return String(raw || '').toUpperCase() === selected.toUpperCase();
      if (type === 'trend') {
        const n = Number(raw); const trend = !Number.isFinite(n) ? 'N/A' : n > 0 ? 'Rising' : n < 0 ? 'Falling' : 'Flat';
        return trend === selected;
      }
      if (type === 'verdict') return String(raw || '').toUpperCase() === selected.toUpperCase();
      if (type === 'oi') { const n = Number(raw); return selected === 'na' ? !Number.isFinite(n) : selected === 'positive' ? Number.isFinite(n) && n > 0 : Number.isFinite(n) && n < 0; }
      const n = Number(raw); if (!Number.isFinite(n)) return false;
      if (type === 'price') return selected === '5000+' ? n > 5000 : selected.endsWith('+') ? n >= Number(selected.replace('+','')) : n >= Number(selected.split('-')[0]) && n <= Number(selected.split('-')[1]);
      if (type === 'change') return selected === 'positive' ? n > 0 : selected === 'negative' ? n < 0 : selected === '1+' ? n > 1 : selected === '-1+' ? n < -1 : n >= Number(selected.split('-')[0]) && n <= Number(selected.split('-')[1]);
      if (type === 'score') return selected === '75+' ? n >= 75 : n >= Number(selected.split('-')[0]) && n <= Number(selected.split('-')[1]);
      if (type === 'volume') return selected === '1.2+' ? n >= 1.2 : n >= Number(selected.split('-')[0]) && n <= Number(selected.split('-')[1]);
      if (type === 'delivery') return selected === '55+' ? n >= 55 : n >= Number(selected.split('-')[0]) && n <= Number(selected.split('-')[1]);
      return true;
    };

    const applyColumnFilters = () => {
      const resultMap = new Map((snapshot?.results || []).map(item => [normalizeSymbol(item.symbol || item.ticker || item.stock), item]));
      surface.querySelectorAll('.scanner-table tbody tr').forEach(row => {
        const symbol = getSymbol(row); const item = resultMap.get(symbol); let visible = true;
        for (const [key, selected] of Object.entries(state)) {
          const type = headerConfig.find(config => config[1] === key)?.[2];
          if (!matches(key === 'stock' ? symbol : valueFor(item, key), type, selected)) { visible = false; break; }
        }
        row.classList.toggle('vikram-column-hidden', !visible);
      });
      surface.querySelectorAll('.vikram-column-filter').forEach(button => button.classList.toggle('active', Boolean(state[button.dataset.filterKey])));
    };

    const closeMenu = () => document.querySelector('.vikram-simple-filter-menu')?.remove();
    const openMenu = (button, label, key, type) => {
      closeMenu();
      const menu = document.createElement('div'); menu.className = 'vikram-simple-filter-menu';
      const options = optionsFor(type, key);
      menu.innerHTML = `<div class="simple-filter-title">${escapeHtml(label)}</div><select aria-label="Filter ${escapeHtml(label)}">${options.map(([value,text]) => `<option value="${escapeHtml(value)}" ${state[key] === value ? 'selected' : ''}>${escapeHtml(text)}</option>`).join('')}</select>`;
      document.body.appendChild(menu);
      const rect = button.getBoundingClientRect();
      menu.style.left = `${Math.max(8, Math.min(rect.left, window.innerWidth - menu.offsetWidth - 8))}px`;
      menu.style.top = `${Math.min(window.innerHeight - menu.offsetHeight - 8, rect.bottom + 5)}px`;
      const select = menu.querySelector('select');
      select.addEventListener('change', () => { const value = select.value; if (value) state[key] = value; else delete state[key]; closeMenu(); applyColumnFilters(); });
      select.focus();
    };

    headers.forEach((th, index) => {
      const [label, key, type] = headerConfig[index];
      th.dataset.filterKey = key;
      th.querySelector('.vikram-column-filter')?.remove();
      const button = document.createElement('button'); button.type = 'button'; button.className = 'vikram-column-filter'; button.dataset.filterKey = key; button.title = `Filter ${label}`; button.setAttribute('aria-label', `Filter ${label}`); button.textContent = '⌄';
      th.appendChild(button); button.addEventListener('click', event => { event.stopPropagation(); openMenu(button, label, key, type); });
    });

    let reset = surface.querySelector('.vikram-filter-reset');
    if (!reset) { reset = document.createElement('button'); reset.type = 'button'; reset.className = 'vikram-filter-reset'; reset.textContent = 'Reset Filters'; segmentBar.appendChild(reset); }
    reset.onclick = () => { Object.keys(state).forEach(key => delete state[key]); closeMenu(); applyColumnFilters(); };
    document.addEventListener('click', event => { if (!event.target.closest('.vikram-simple-filter-menu') && !event.target.closest('.vikram-column-filter')) closeMenu(); });
    window.addEventListener('scroll', closeMenu, true); window.addEventListener('resize', closeMenu);
    new MutationObserver(() => setTimeout(applyColumnFilters, 0)).observe(surface.querySelector('.scanner-table-wrap') || surface, { childList: true, subtree: true });
    setInterval(async () => { const next = await getScannerSnapshot(); if (next) { snapshot = next; applyColumnFilters(); } }, 60000);
    applyColumnFilters();
  };

  const setupDiscoveryTabsAndColors = async () => {
    const surface = document.querySelector('.scanner-container-surface');
    const tabs = surface?.querySelector('.surface-tabs');
    if (!surface || !tabs) return;
    ensureSegmentStyles();
    if (!document.getElementById('vikramDiscoveryStyles')) {
      const style = document.createElement('style'); style.id = 'vikramDiscoveryStyles';
      style.textContent = `.vikram-simple-filter-menu{position:fixed;z-index:10000;min-width:210px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:10px;box-shadow:var(--shadow-lg);padding:9px}.simple-filter-title{font-size:10px;font-weight:900;color:var(--text-main);margin:0 0 6px}.vikram-simple-filter-menu select{width:100%;border:1px solid var(--border-subtle);background:var(--bg-card-2);color:var(--text-main);border-radius:7px;padding:8px;font-size:11px;font-weight:800}.scanner-table td.vikram-positive{color:var(--green);font-weight:900}.scanner-table td.vikram-negative{color:var(--red);font-weight:900}.scanner-table td.vikram-score-good,.scanner-table td.vikram-score-mid,.scanner-table td.vikram-score-low,.scanner-table td.vikram-bullish,.scanner-table td.vikram-warning,.scanner-table td.vikram-bearish{font-weight:900;padding-left:8px;padding-right:8px}.scanner-table td.vikram-score-good{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green);border-radius:6px}.scanner-table td.vikram-score-mid{background:color-mix(in srgb,#f59e0b 18%,transparent);color:#fbbf24;border-radius:6px}.scanner-table td.vikram-score-low{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);border-radius:6px}.scanner-table td.vikram-bullish{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green);border-radius:6px}.scanner-table td.vikram-warning{background:color-mix(in srgb,#f59e0b 16%,transparent);color:#fbbf24;border-radius:6px}.scanner-table td.vikram-bearish{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);border-radius:6px}.scanner-table td.vikram-verdict{font-weight:900}.vikram-discovery-panel{margin-top:13px}.vikram-discovery-table{width:100%;min-width:980px;border-collapse:collapse}.vikram-discovery-table th,.vikram-discovery-table td{padding:10px;border-bottom:1px solid var(--border-subtle);font-size:10px;text-align:left}.vikram-discovery-table th{font-size:8px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;background:var(--bg-card-2)}.vikram-discovery-table .v-confirmed{color:var(--green);font-weight:900}.vikram-discovery-table .v-starting{color:var(--accent-cyan);font-weight:900}.vikram-discovery-table .v-quiet{color:#a855f7;font-weight:900}.vikram-discovery-table .v-distribution{color:var(--red);font-weight:900}.vikram-discovery-table .score-good{color:var(--green);font-weight:900}.vikram-discovery-table .score-mid{color:#fbbf24;font-weight:900}.vikram-discovery-table .score-low{color:var(--red);font-weight:900}`; document.head.appendChild(style);
    }

    const scannerWrap = surface.querySelector('.scanner-table-wrap');
    let panel = surface.querySelector('.vikram-discovery-panel');
    if (!panel) { panel = document.createElement('div'); panel.className = 'vikram-discovery-panel vikram-tab-hidden'; scannerWrap?.parentNode.insertBefore(panel, scannerWrap); }
    const addTab = (id, label) => { if (tabs.querySelector(`[data-vikram-discovery="${id}"]`)) return; const b = document.createElement('button'); b.type='button'; b.className='surface-tab'; b.dataset.vikramDiscovery=id; b.textContent=label; tabs.appendChild(b); };
    addTab('radar','Opportunity Radar'); addTab('gems','Hidden Gems');

    const escape = value => String(value ?? '').replace(/[&<>\"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','\"':'&quot;'}[char]));
    const num = value => { const n=Number(value); return Number.isFinite(n)?n:null; };
    const money = value => { const n=num(value); return n===null?'N/A':`₹${n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}`; };
    const fmt = (value,suffix='') => { const n=num(value); return n===null?'N/A':`${n.toFixed(1)}${suffix}`; };
    const verdictClass = verdict => { const v=String(verdict||'').toUpperCase(); return v.includes('CONFIRMED')?'v-confirmed':v.includes('STARTING')?'v-starting':v.includes('QUIET')?'v-quiet':v.includes('DISTRIBUTION')?'v-distribution':''; };
    const scoreClass = score => score>=75?'score-good':score>=55?'score-mid':'score-low';

    const renderDiscovery = async kind => {
      const snap = await getScannerSnapshot();
      if (!snap) { panel.innerHTML='<div class="dashboard-card"><p class="text-muted">DATA N/A — a verified EOD scanner snapshot is required.</p></div>'; return; }
      const rows = Array.isArray(snap.results)?snap.results:[];
      let ranked;
      if (kind === 'radar') {
        const rank = row => { const score=num(row.score); const v=String(row.verdict||''); return (score??-1)+(v==='ACCUMULATION CONFIRMED'?20:v==='ACCUMULATION STARTING'?10:0); };
        ranked=rows.filter(row=>num(row.score)!==null && String(row.verdict||'')!=='DISTRIBUTION').sort((a,b)=>rank(b)-rank(a)||(num(b.score)-num(a.score))).slice(0,100);
      } else {
        ranked=rows.map(row=>{const m=row.metrics||{};const score=num(row.score);const signals=[num(m.volumeRatio)!==null&&num(m.volumeRatio)>=1.2,num(m.deliveryPct)!==null&&num(m.deliveryPct)>=45,num(m.obvTrend)!==null&&num(m.obvTrend)>0,num(m.changeOi)!==null&&num(m.changeOi)>0,num(m.priceChangePct)!==null&&num(m.priceChangePct)>=0].filter(Boolean).length;return {row,m,score,signals};}).filter(x=>x.score!==null&&x.score>=55&&x.score<85&&x.row.verdict!=='DISTRIBUTION'&&x.signals>=2).sort((a,b)=>b.signals-a.signals||b.score-a.score).slice(0,25);
      }
      const data = kind==='radar'?ranked.map(row=>({row,m:row.metrics||{},score:num(row.score)})):ranked;
      panel.innerHTML=`<div class="dashboard-card"><h2 class="card-headline">${kind==='radar'?'🛰 Opportunity Radar':'💎 Hidden Gems Alpha Discovery'}</h2><p class="text-muted">${escape(snap.dataStatus||'EOD VERIFIED')} · As of ${escape(snap.asOf||'N/A')} · ${data.length} verified results</p><div class="scanner-table-wrap"><table class="vikram-discovery-table"><thead><tr>${kind==='radar'?'<th>Rank</th><th>Symbol</th><th>Price</th><th>Score</th><th>Price %</th><th>Volume</th><th>Delivery</th><th>OI Change</th><th>Verdict</th><th>Why</th>':'<th>Rank</th><th>Symbol</th><th>Score</th><th>Price %</th><th>Volume</th><th>Delivery</th><th>OI Change</th><th>Signals</th><th>Verdict</th>'}</tr></thead><tbody>${data.map((x,i)=>{const r=x.row,m=x.m||{},s=x.score??num(r.score);const why=Array.isArray(r.why)?r.why.slice(0,3).join(' '):'Verified scanner signals';return `<tr><td>${i+1}</td><td><strong>${escape(r.symbol||r.ticker||'N/A')}</strong></td>${kind==='radar'?`<td>${money(m.close??m.last_price)}</td>`:''}<td class="${scoreClass(s)}">${s===null?'N/A':s}</td><td>${fmt(m.priceChangePct,'%')}</td><td>${fmt(m.volumeRatio,'x')}</td><td>${fmt(m.deliveryPct,'%')}</td><td>${m.changeOi==null?'N/A':Number(m.changeOi).toLocaleString('en-IN')}</td>${kind==='gems'?`<td>${x.signals}/5</td>`:''}<td class="${verdictClass(r.verdict)}">${escape(r.verdict||'N/A')}</td>${kind==='radar'?`<td>${escape(why)}</td>`:''}</tr>`;}).join('')}</tbody></table></div></div>`;
    };

    const colorize = () => {
      surface.querySelectorAll('.scanner-table tbody tr').forEach(row => {
        const cells=row.querySelectorAll('td'); if(cells.length<9) return;
        cells.forEach(cell=>cell.classList.remove('vikram-positive','vikram-negative','vikram-score-good','vikram-score-mid','vikram-score-low','vikram-bullish','vikram-warning','vikram-bearish','vikram-verdict'));
        const change=num(cells[2]?.textContent.replace('%','')); if(change!==null) cells[2].classList.add(change>0?'vikram-positive':change<0?'vikram-negative':'vikram-warning');
        const score=num(cells[3]?.textContent); if(score!==null) cells[3].classList.add(score>=75?'vikram-score-good':score>=55?'vikram-score-mid':'vikram-score-low');
        const volume=num(cells[4]?.textContent.replace('x','')); if(volume!==null) cells[4].classList.add(volume>=1.1?'vikram-bullish':volume>=0.8?'vikram-warning':'vikram-bearish');
        const delivery=num(cells[5]?.textContent.replace('%','')); if(delivery!==null) cells[5].classList.add(delivery>=55?'vikram-bullish':delivery>=45?'vikram-warning':'vikram-bearish');
        const trend=String(cells[6]?.textContent||''); cells[6].classList.add(trend==='Rising'?'vikram-bullish':trend==='Falling'?'vikram-bearish':'vikram-warning');
        const oi=String(cells[7]?.textContent||''); if(oi==='N/A') cells[7].classList.add('vikram-warning'); else { const n=num(oi.replace(/,/g,'')); cells[7].classList.add(n!==null&&n>0?'vikram-positive':n!==null&&n<0?'vikram-negative':'vikram-warning'); }
        const verdict=String(cells[8]?.textContent||'').toUpperCase(); cells[8].classList.add('vikram-verdict'); if(verdict.includes('CONFIRMED')) cells[8].classList.add('vikram-bullish'); else if(verdict.includes('STARTING')) cells[8].classList.add('vikram-positive'); else if(verdict.includes('QUIET')) cells[8].classList.add('vikram-warning'); else if(verdict.includes('DISTRIBUTION')) cells[8].classList.add('vikram-bearish'); else cells[8].classList.add('vikram-warning');
      });
    };

    const setDiscoveryTab = kind => {
      surface.querySelectorAll('.surface-tab').forEach(tab=>tab.classList.toggle('active', tab.dataset.vikramDiscovery===kind || (!kind && !tab.dataset.vikramDiscovery && tab.textContent.trim()==='Top Opportunities')));
      if (kind) { scannerWrap?.classList.add('vikram-tab-hidden'); panel.classList.remove('vikram-tab-hidden'); renderDiscovery(kind); }
      else { scannerWrap?.classList.remove('vikram-tab-hidden'); panel.classList.add('vikram-tab-hidden'); }
    };
    tabs.querySelectorAll('[data-vikram-discovery]').forEach(tab=>tab.addEventListener('click',()=>setDiscoveryTab(tab.dataset.vikramDiscovery)));
    colorize();
    new MutationObserver(()=>{colorize(); if(!panel.classList.contains('vikram-tab-hidden')) {}}).observe(scannerWrap||surface,{childList:true,subtree:true});
  };
'''

          text = text[:start] + replacement + text[end:]
          text = text.replace('  await setupColumnFilters();\n', '  await setupColumnFilters();\n  await setupDiscoveryTabsAndColors();\n')
          path.write_text(text, encoding='utf-8')

          # Remove this one-shot workflow after it performs the repair.
          wf = Path('.github/workflows/ui-repair-simple-filters.yml')
          wf.unlink(missing_ok=True)

          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','js/app.js','.github/workflows/ui-repair-simple-filters.yml'],check=True)
          subprocess.run(['git','commit','-m','fix(ui): simplify scanner filters and restore discovery results'],check=True)
          subprocess.run(['git','push'],check=True)
