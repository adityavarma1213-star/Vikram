name: VIKRAM Free Scanner

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'accumulation.html'
      - 'accumulation/**'
      - '.github/workflows/static-scanner.yml'
  schedule:
    - cron: '30 13 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vikram-scanner
  cancel-in-progress: false

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scanner dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Backfill one year of NSE EOD history
        run: node server/src/backfillHistory.js
        env:
          BACKFILL_CALENDAR_DAYS: 370

      - name: Fetch latest NSE EOD data and build period snapshots
        run: node server/src/staticSnapshot.js

      - name: Verify scanner snapshot
        run: |
          node -e "const fs=require('fs'); const p='data/scanner.json'; if(!fs.existsSync(p)) throw new Error('scanner.json was not generated'); const x=JSON.parse(fs.readFileSync(p,'utf8')); if(x.status!=='ok') throw new Error('Scanner snapshot status is not ok'); if(!x.asOf) throw new Error('Scanner snapshot has no asOf date'); if(!Array.isArray(x.results)) throw new Error('Scanner snapshot has no results array'); for (const k of ['1D','1W','1M','3M','6M','1Y']) if(!Array.isArray(x.periods?.[k])) throw new Error('Missing period '+k); console.log('Scanner snapshot OK:', x.asOf, 'historyDays:', x.historyDays, 'results:', x.results.length, '1Y:', x.periods['1Y'].length);"

      - name: Persist rolling market history and period snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/scanner.json data/market-history
          if git diff --cached --quiet; then
            echo 'No market-data changes to commit.'
          else
            git commit -m 'chore: refresh NSE scanner history'
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
