name: VIKRAM Static Site Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'accumulation.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'public/**'
      - 'data/**'
      - '.github/workflows/static-scanner.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-vikram-static-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload existing static site files (no data acquisition)
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
