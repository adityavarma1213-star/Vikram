name: VIKRAM Free Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vikram-scanner
  cancel-in-progress: false

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scanner dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Fetch NSE EOD data and build static snapshot
        run: node server/src/staticSnapshot.js

      - name: Verify scanner snapshot
        run: |
          node -e "const fs=require('fs'); const p='data/scanner.json'; if(!fs.existsSync(p)) throw new Error('scanner.json was not generated'); const x=JSON.parse(fs.readFileSync(p,'utf8')); if(x.status!=='ok') throw new Error('Scanner snapshot status is not ok'); if(!x.asOf) throw new Error('Scanner snapshot has no asOf date'); if(!Array.isArray(x.results)) throw new Error('Scanner snapshot has no results array'); console.log('Scanner snapshot OK:', x.asOf, 'results:', x.results.length);"

      - name: Persist rolling market history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/scanner.json data/market-history
          if git diff --cached --quiet; then
            echo 'No market-data changes to commit.'
          else
            git commit -m 'chore: refresh NSE scanner data'
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
