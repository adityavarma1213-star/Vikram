name: VIKRAM Research UI Repair

on:
  push:
    branches: [main]
    paths:
      - 'js/researchRepair.js'
      - '.github/workflows/research-ui-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject research repair and refresh PWA cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="js/researchRepair.js"></script>'
          if tag not in s:
              marker='<script src="js/discoveryRepair.js"></script>'
              if marker in s:
                  s=s.replace(marker, tag+'\n'+marker)
              else:
                  s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s)
          sw=Path('sw.js')
          x=sw.read_text()
          x=x.replace("CACHE='vikram-v13'","CACHE='vikram-v14'")
          if "'./js/researchRepair.js'" not in x:
              x=x.replace("'./js/discoveryRepair.js'","'./js/discoveryRepair.js','./js/researchRepair.js'")
          sw.write_text(x)
          PY
          node --check js/researchRepair.js
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(ui): inject research repair and refresh cache'
          git push
